# The Name Tables for KK (D14): curated names, not game data, so they live in the repository (ADR 0007).
#
# [maps]        a Map's English name and the area its catalog goes under (Maps/<area>, Structures/<area>)
# [naming]      what is cut from a game name before its words are translated
# [words]       romaji word -> English; a word not listed keeps its romaji and goes to the Build Report
# [[categories]] Props/<category>, by the first rule one of the Prop's words matches
# [[overrides]] corrections by the Placement root's game name (a regular expression) or Content Hash:
#               kind = "prop" or "structure", category, name

[times_of_day]
day = "Day"
evening = "Evening"
night = "Night"

[naming]
# Regular expressions removed from the start of a game name, repeatedly, in this order.
strip = ['^p_', '^mo_', '^o_', '^m00_', '^koi_', '^stu_', '^map\d+_']
default_category = "Other"
# Words that are English as the game writes them: title-cased, not reported.
english = ["air", "arch", "arm", "back", "ball", "bar", "beat", "bed", "black", "blue", "book", "box", "candy",
           "caution", "center", "chair", "colors", "cookie", "dining", "far", "floor", "flower", "football", "frame",
           "front", "glow", "goal", "green", "heart", "inner", "left", "light", "line", "lives", "main", "mat",
           "memo", "menu", "mid", "monitor", "near", "neon", "outer", "over", "parts", "pen", "pink", "plate", "pot",
           "rack", "red", "reel", "right", "screen", "side", "sky", "stage", "step", "table", "time", "toilet",
           "truss", "upper", "wing"]
# A 3D tool's leftovers in names, left out.
drop = ["geo"]

