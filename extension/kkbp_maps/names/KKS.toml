# The Name Tables for KKS (D14): curated names, not game data, so they live in the repository (ADR 0007).
# The sections are KK.toml's. Story Maps are named after the map list's DisplayName; Studio's KK ports
# keep KK's names, and Studio's own builds of KKS Maps add " (Studio)", since they are Maps of their own
# wherever their geometry differs (D22).

[times_of_day]
morning = "Morning"
day = "Day"
evening = "Evening"
night = "Night"

[naming]
# Regular expressions removed from a game name, repeatedly, in this order: prefixes, and SpeedTree's
# level-of-detail suffix. A '20_' left from a set number goes too.
strip = ['^p_', '^mo_', '^o_', '^ks_', '^kn_', '^koi_', '^toon_', '^[mr]\d+_?', '^map\d+_', '^\d+_', '_LOD\d+$']
default_category = "Other"
english = ["air", "arch", "arm", "back", "ball", "bar", "basket", "beat", "bed", "bench", "black", "blue", "book", "booth", "box", "bush", "candy", "caution", "center", "chair", "cloth", "colors", "cookie", "counter", "curtain", "dining", "door", "far", "fence", "floor", "flower", "football", "frame", "front", "gate", "glass", "glow", "goal", "grass", "green", "heart", "inner", "lamp", "left", "light", "line", "lives", "lounge", "main", "mat", "memo", "menu", "mid", "mirror", "monitor", "near", "neon", "outer", "over", "palm", "parasol", "parts", "pen", "pink", "planter", "plate", "pool", "pot", "rack", "red", "reel", "register", "right", "rock", "roof", "room", "screen", "sea", "shelf", "shop", "shower", "side", "sign", "sky", "sofa", "stage", "step", "sun", "table", "time", "toilet", "towel", "tree", "truss", "umbrella", "upper", "wall", "window", "wing"]
drop = ["geo", "kois", "mi", "ei"]


